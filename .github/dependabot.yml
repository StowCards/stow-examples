version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ['*']

  # The Node.js SDK. chore(deps) commits do not release it on their own.
  - package-ecosystem: npm
    directory: /node
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore(deps)
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Types track the oldest supported Node.js line (22).
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]
      # typescript-eslint supports TypeScript below 6.1; move both together by hand.
      - dependency-name: typescript
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: maven
    directory: /java
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
