# Release automation for the Node.js SDK in node/ (Conventional Commits +
# release-please, as in Google's client libraries). Only commits that touch
# node/ count. Merging the release PR that release-please keeps open tags the
# release (node-vX.Y.Z), and the publish job ships it to npm through trusted
# publishing (OIDC): no npm token is stored, and npm attaches a provenance
# attestation automatically. Setup steps are in node/RELEASING.md.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write # create the "autorelease: pending" and "autorelease: tagged" labels
      pull-requests: write
    # The package lives at node/, so release-please-action names its outputs
    # node--release_created and node--tag_name (the bare names are for a root
    # package only).
    outputs:
      release_created: ${{ steps.release.outputs['node--release_created'] }}
      tag_name: ${{ steps.release.outputs['node--tag_name'] }}
    steps:
      # A pull request opened with GITHUB_TOKEN starts no pull_request workflows,
      # so the release PR would never run the required checks. A GitHub App
      # installation token does start them. Without the app (RELEASE_APP_ID
      # unset) the workflow falls back to GITHUB_TOKEN; see node/RELEASING.md.
      - id: app-token
        if: vars.RELEASE_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write # upload the SBOM to the GitHub release
      id-token: write # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later. The version is exact, like
      # the action SHAs above, so this job (which holds id-token: write) never
      # runs an npm release nobody has reviewed. Bump it on purpose.
      - name: Use an npm that supports trusted publishing (11.5.1 or later)
        run: npm install --global npm@11.21.0
      - run: npm ci
      - name: Run every check before publishing
        run: npm run ci
      - name: Publish to npm with provenance
        run: npm publish --access public
      - name: Attach a CycloneDX SBOM to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          npm sbom --sbom-format cyclonedx --omit dev > sbom.cdx.json
          gh release upload "$TAG" sbom.cdx.json --repo "$GITHUB_REPOSITORY"
