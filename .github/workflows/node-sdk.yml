# Checks the Node.js SDK in node/: format, lint, types, tests with coverage,
# build, the public API report and the packed package. Runs on every pull
# request, like the examples' checks, because the ruleset requires its jobs.
name: Node.js SDK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: node

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, API report and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - name: Verify registry signatures and provenance of dependencies
        run: npm audit signatures
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=low
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - name: Check the public API report is up to date
        run: npm run api:check
      - name: Check package exports and types
        run: npm run check:package

  test:
    name: Test (Node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24, 26]
        include:
          - os: windows-latest
            node: 24
          - os: macos-latest
            node: 24
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - run: npm ci
      - run: npm run test:coverage
      - name: Smoke-test the built package in ESM and CommonJS
        shell: bash
        run: |
          npm run build
          node --input-type=module -e "import { StowClient, VERSION } from '@stowcards/sdk'; new StowClient({ apiKey: 'stow_ci' }); console.log('esm', VERSION);"
          node -e "const { StowClient, VERSION } = require('@stowcards/sdk'); new StowClient({ apiKey: 'stow_ci' }); console.log('cjs', VERSION);"
      - if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: node/coverage/
          retention-days: 14
